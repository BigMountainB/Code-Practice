<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-label="Davis Plumbing luxury heraldic lockup">
  <title>Davis Plumbing — Heraldic Luxury Lockup (Concept 3)</title>
  <desc>A refined slim shield with a cross-and-riser emblem paired with an elegant serif wordmark and fine gold rules, in the spirit of luxury custom-home builders.</desc>
  <defs>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc689"/><stop offset="1" stop-color="#a5843f"/>
    </linearGradient>
  </defs>

  <!-- Slim emblem -->
  <g transform="translate(90,110)">
    <path d="M0 -84 L58 -66 V6 C58 46 32 74 0 88 C-32 74 -58 46 -58 6 V-66 Z" fill="#8f1d21"/>
    <path d="M0 -84 L58 -66 V6 C58 46 32 74 0 88 C-32 74 -58 46 -58 6 V-66 Z" fill="none" stroke="url(#brassL)" stroke-width="2.5"/>
    <path d="M0 -74 L49 -58 V6 C49 40 26 65 0 78 C-26 65 -49 40 -49 6 V-58 Z" fill="none" stroke="#e6d29a" stroke-width="1" opacity="0.5"/>
    <!-- riser + cross -->
    <rect x="-4" y="-46" width="8" height="86" rx="3" fill="url(#brassL)"/>
    <rect x="-26" y="-22" width="52" height="8" rx="3" fill="url(#brassL)"/>
    <!-- small valve -->
    <circle cx="0" cy="50" r="11" fill="none" stroke="url(#brassL)" stroke-width="4"/>
    <line x1="-11" y1="50" x2="11" y2="50" stroke="url(#brassL)" stroke-width="3"/>
    <line x1="0" y1="39" x2="0" y2="61" stroke="url(#brassL)" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <g>
    <line x1="182" y1="70" x2="182" y2="150" stroke="#d8ccae" stroke-width="1.5"/>
    <text x="204" y="98" fill="#16191d" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="52" letter-spacing="1">Davis</text>
    <text x="205" y="140" fill="#8f1d21" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="40">Plumbing</text>
    <g>
      <line x1="206" y1="158" x2="470" y2="158" stroke="#c1a15a" stroke-width="1"/>
      <text x="206" y="182" fill="#6b6357" font-family="system-ui, sans-serif" font-size="13" letter-spacing="5">CRAFTSMANSHIP · SINCE 2006</text>
    </g>
  </g>
</svg>
