<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340" role="img" aria-label="Davis Plumbing family crest">
  <title>Davis Plumbing — Family Crest (Concept 1)</title>
  <desc>A modernized heraldic shield with a copper riser and valve forming a subtle cross, brass border, and a wordmark banner. Est. 2006.</desc>
  <defs>
    <linearGradient id="fieldC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5282d"/>
      <stop offset="1" stop-color="#6d1216"/>
    </linearGradient>
    <linearGradient id="brassC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d29a"/>
      <stop offset="0.5" stop-color="#c1a15a"/>
      <stop offset="1" stop-color="#9c7c3c"/>
    </linearGradient>
    <linearGradient id="copperC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d59a6a"/>
      <stop offset="0.5" stop-color="#a5673b"/>
      <stop offset="1" stop-color="#7d4a26"/>
    </linearGradient>
  </defs>

  <!-- Shield outline (brass) -->
  <path d="M150 12 L268 44 V150 C268 232 214 286 150 314 C86 286 32 232 32 150 V44 Z"
        fill="url(#brassC)"/>
  <!-- Crimson field -->
  <path d="M150 24 L258 53 V150 C258 224 209 274 150 300 C91 274 42 224 42 150 V53 Z"
        fill="url(#fieldC)"/>
  <!-- Inner brass keyline -->
  <path d="M150 34 L249 61 V150 C249 217 204 264 150 289 C96 264 51 217 51 150 V61 Z"
        fill="none" stroke="#d8be86" stroke-width="1.4" opacity="0.7"/>

  <!-- Chief (top band) with EST -->
  <path d="M150 34 L249 61 V84 H51 V61 Z" fill="#2a1416" opacity="0.35"/>
  <text x="150" y="66" text-anchor="middle" fill="#e6d29a" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6">EST. 2006</text>

  <!-- Central emblem: copper riser + valve forming a cross -->
  <g transform="translate(150,182)">
    <!-- vertical riser -->
    <rect x="-7" y="-70" width="14" height="128" rx="4" fill="url(#copperC)" stroke="#5f3a1e" stroke-width="1"/>
    <!-- horizontal arm (the cross) -->
    <rect x="-46" y="-34" width="92" height="14" rx="4" fill="url(#copperC)" stroke="#5f3a1e" stroke-width="1"/>
    <!-- top cap fitting -->
    <rect x="-12" y="-78" width="24" height="12" rx="3" fill="url(#brassC)" stroke="#5f3a1e" stroke-width="0.8"/>
    <!-- valve wheel at base -->
    <circle cx="0" cy="52" r="20" fill="none" stroke="url(#brassC)" stroke-width="7"/>
    <g stroke="url(#brassC)" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="34" x2="0" y2="70"/>
      <line x1="-18" y1="52" x2="18" y2="52"/>
      <line x1="-13" y1="39" x2="13" y2="65"/>
      <line x1="13" y1="39" x2="-13" y2="65"/>
    </g>
    <circle cx="0" cy="52" r="5" fill="url(#copperC)"/>
    <!-- valve arm end fittings -->
    <rect x="-52" y="-36" width="10" height="18" rx="2" fill="url(#brassC)"/>
    <rect x="42" y="-36" width="10" height="18" rx="2" fill="url(#brassC)"/>
  </g>

  <!-- Banner ribbon -->
  <g>
    <path d="M28 300 H272 L256 328 H44 Z" fill="url(#fieldC)"/>
    <path d="M12 292 L44 320 L28 300 Z" fill="#6d1216"/>
    <path d="M288 292 L256 320 L272 300 Z" fill="#6d1216"/>
    <path d="M28 300 H272 L256 328 H44 Z" fill="none" stroke="#d8be86" stroke-width="1.2"/>
    <text x="150" y="320" text-anchor="middle" fill="#f7f3ea" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="19" letter-spacing="4">DAVIS PLUMBING</text>
  </g>
</svg>
