<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180" role="img" aria-label="Davis Plumbing horizontal logo">
  <title>Davis Plumbing — Horizontal Lockup</title>
  <desc>Primary horizontal lockup: the crest emblem beside a stacked serif wordmark. For website headers, letterhead, and email signatures.</desc>
  <defs>
    <linearGradient id="fH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5282d"/><stop offset="1" stop-color="#6d1216"/></linearGradient>
    <linearGradient id="bH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6d29a"/><stop offset="1" stop-color="#a5673b"/></linearGradient>
    <linearGradient id="cH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d59a6a"/><stop offset="1" stop-color="#7d4a26"/></linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(90,90) scale(0.92)">
    <path d="M0 -80 L60 -64 V4 C60 46 34 74 0 88 C-34 74 -60 46 -60 4 V-64 Z" fill="url(#fH)"/>
    <path d="M0 -80 L60 -64 V4 C60 46 34 74 0 88 C-34 74 -60 46 -60 4 V-64 Z" fill="none" stroke="url(#bH)" stroke-width="4"/>
    <rect x="-5" y="-44" width="10" height="92" rx="3" fill="url(#cH)"/>
    <rect x="-30" y="-20" width="60" height="10" rx="3" fill="url(#cH)"/>
    <rect x="-9" y="-50" width="18" height="9" rx="2" fill="url(#bH)"/>
    <circle cx="0" cy="52" r="13" fill="none" stroke="url(#bH)" stroke-width="5"/>
    <line x1="-13" y1="52" x2="13" y2="52" stroke="url(#bH)" stroke-width="3.5"/>
    <line x1="0" y1="39" x2="0" y2="65" stroke="url(#bH)" stroke-width="3.5"/>
  </g>
  <!-- wordmark -->
  <text x="185" y="82" fill="#16191d" font-family="Georgia, serif" font-weight="500" font-size="58" letter-spacing="0.5">Davis</text>
  <text x="186" y="128" fill="#8f1d21" font-family="Georgia, serif" font-style="italic" font-size="44">Plumbing</text>
  <line x1="188" y1="146" x2="560" y2="146" stroke="#c1a15a" stroke-width="1"/>
  <text x="188" y="168" fill="#6b6357" font-family="system-ui, sans-serif" font-size="13" letter-spacing="5">FAMILY OWNED · RENTON, WA · EST. 2006</text>
</svg>
